# Backend FastAPI — développement, tests d'intégration, CI et débogage.
#
# Ce n'est plus le backend du produit : l'extension embarque son propre service
# local (vscode-extension/backend/) et le démarre elle-même. Cette stack reste
# utile pour développer contre l'implémentation Python, pour la CI, et pour
# relire un historique SQLite écrit avant cette version — dans ce cas, régler
# securityCenter.backend.mode sur « docker ».
services:
  backend:
    build:
      context: ./backend
    image: security-center/backend:local
    container_name: security-center-backend
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SECURITY_CENTER_API_KEY: "${SECURITY_CENTER_API_KEY:-}"
    volumes:
      - security-center-data:/data
    restart: unless-stopped

volumes:
  security-center-data:
    name: security-center-data
