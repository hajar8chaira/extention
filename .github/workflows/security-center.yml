name: Security Center

on:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  pull-request-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test Security Center
        working-directory: vscode-extension
        run: npm test

      - name: Run incremental security gate
        run: >-
          node vscode-extension/src/cli.js scan
          --workspace .
          --tools Semgrep,Gitleaks,Trivy,OSV-Scanner
          --incremental
          --base-ref ${{ github.event.pull_request.base.sha }}
          --semgrep-config security-rules/semgrep.yml
          --fail-on HIGH
          --format sarif
          --output security-center-incremental.sarif

      - name: Upload incremental SARIF
        if: always() && hashFiles('security-center-incremental.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-center-incremental.sarif
          category: security-center-incremental

      - name: Preserve incremental SARIF
        if: always() && hashFiles('security-center-incremental.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-center-incremental-sarif
          path: security-center-incremental.sarif
          retention-days: 30

  scheduled-full-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test Security Center
        working-directory: vscode-extension
        run: npm test

      - name: Run complete security scan
        run: >-
          node vscode-extension/src/cli.js scan
          --workspace .
          --tools Semgrep,Gitleaks,Trivy,OSV-Scanner
          --semgrep-config security-rules/semgrep.yml
          --fail-on HIGH
          --format sarif
          --output security-center-full.sarif

      - name: Upload complete SARIF
        if: always() && hashFiles('security-center-full.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-center-full.sarif
          category: security-center-full

      - name: Preserve complete SARIF
        if: always() && hashFiles('security-center-full.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: security-center-full-sarif
          path: security-center-full.sarif
          retention-days: 30
