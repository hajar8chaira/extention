services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    pull_policy: missing
    container_name: security-center-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: "no"
    networks:
      - security-lab

networks:
  security-lab:
    name: security-center-lab
    driver: bridge
